<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LasaLokal — Admin Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
    body {
      background: #241009;
    }

    .admin-header {
      padding: 24px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .admin-header .wrap {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .admin-header .logo {
      color: var(--cream);
      font-family: 'Fraunces', serif;
      font-size: 20px;
    }

    .admin-header .tag {
      color: var(--gold);
      font-size: 13px;
      font-weight: 600;
    }

    .back-site {
      color: var(--cream);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 8px 14px;
      border-radius: 999px;
    }

    .back-site:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .order-card {
      background: #341509;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 10px;
    }

    .order-top {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      color: #E9E2D6;
      font-size: 14px;
    }

    .order-total {
      font-family: 'Fraunces', serif;
      font-size: 18px;
      color: var(--gold);
    }

    .order-items {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 13px;
      color: #C7B8A9;
    }
  </style>
</head>

<body>

  <div class="admin-header">
    <div class="wrap">
      <div class="logo">LasaLokal</div>
      <div style="display:flex; align-items:center; gap:12px;">
        <a href="index.html" class="back-site">← Back to website</a>
        <div class="tag">🔒 Admin Dashboard</div>
      </div>
    </div>
  </div>

  <section id="admin" style="padding-top:32px;">
    <div class="wrap">
      <h2>Overview</h2>
      <p style="color:#C7B8A9; font-size:14px;">Live data from your Supabase database — updates automatically every few
        seconds.</p>
      <div class="stat-grid" id="statGrid"></div>

      <h3 style="color:var(--cream); font-size:16px; margin:32px 0 14px;">Most viewed products</h3>
      <ul class="rank-list" id="rankList"></ul>

      <h3 style="color:var(--cream); font-size:16px; margin:32px 0 14px;">Recent orders</h3>
      <div id="ordersList"></div>

      <h3 style="color:var(--cream); font-size:16px; margin:32px 0 14px;">Visitor locations</h3>
      <div id="locationsList"></div>
    </div>
  </section>

  <script src="admin.js"></script>
</body>

</html>
